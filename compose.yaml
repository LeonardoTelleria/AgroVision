name: agrovision

services:
  postgres:
    image: postgres:17-alpine
    container_name: agrovision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrovision
      POSTGRES_USER: agrovision
      POSTGRES_PASSWORD: agrovision_demo
    ports:
      - "5432:5432"
    volumes:
      - agrovision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovision -d agrovision"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  agrovision_postgres_data:
